name: Render health check

on:
  schedule:
    # Every ten minutes, offset from the start of the hour to reduce scheduling congestion.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-keepalive.yml'
      - 'scripts/ping-render.mjs'

permissions:
  contents: read

concurrency:
  group: render-health-check
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://coy-9vf6.onrender.com/health' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check Render API health
        run: node scripts/ping-render.mjs
